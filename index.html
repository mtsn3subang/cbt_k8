<style>

</style></head><body>
<div id="root"></div><div id="md" hidden></div><div id="ld" hidden>Memproses…</div><div id="wr" hidden></div>
<script>
/* ====== LOGO: ganti teks PASTE_LOGO_BASE64_DI_SINI dengan isi const LOGO dari file lama Anda (data:image/png;base64,...) ====== */
const LOGO='PASTE_LOGO_BASE64_DI_SINI';
try{document.getElementById('fav').href=LOGO}catch(e){}
/* ======================================================================== */
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* ====== PENGATURAN: URL web app Apps Script (berakhiran /exec) ====== */
const API_URL='https://script.google.com/macros/s/AKfycbyWrhLwGniDUmfDPJwW7cpDbq5PgV0-P4wtO4fMXgtVJbmCzPdq_4f77TTiXtXvgPjs/exec';
/* ======================================================================== */
const logoH=(px)=>`<div style="text-align:center;margin-bottom:8px"><img src="${LOGO}" alt="Logo MTsN 3 Subang" style="height:${px}px;width:auto"></div>`;
const seed=()=>({cfg:{nama:'CBT MTsN 3 Subang',ket:'Ujian Online Berbasis Komputer'},mapel:[],guru:[],topik:[],soal:[],grp:[],pes:[],tes:[],token:{},hasil:[],role:'admin'});
let PEND={},PBUSY=0,OFF=0,S=seed(),PUB={...S.cfg},AU=null,SNAP={},STAT='',TK='';
const RETRY={plogin:1,pstart:1,pans:1,pfin:1,img:1,info:1};
/* ====== PENGATURAN BEBAN SERVER (aman untuk ±700 peserta bersamaan) ====== */
const LOGIN_JITTER=4000,   /* ms: sebar waktu login */
 START_JITTER=15000,       /* ms: sebar waktu mulai tes */
 AUTO_JITTER=10000,        /* ms: sebar pengiriman otomatis saat waktu habis */
 SYNC_MIN=60000,SYNC_RND=60000; /* ms: simpan jawaban ke server tiap 60–120 detik (jawaban tetap aman di perangkat) */
let PT_AT=0;
const wait=ms=>new Promise(z=>setTimeout(z,ms));
/* Pustaka berat (PDF/Excel ±1 MB) hanya dimuat untuk admin/guru, TIDAK untuk peserta ujian */
let LIBS=0;function loadLibs(){if(LIBS)return;LIBS=1;const B='https://cdnjs.cloudflare.com/ajax/libs/';let p=Promise.resolve();['jspdf/2.5.1/jspdf.umd.min.js','jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js','xlsx/0.18.5/xlsx.full.min.js'].forEach(u=>{p=p.then(()=>new Promise(z=>{const s=document.createElement('script');s.src=B+u;s.onload=s.onerror=()=>z();document.head.appendChild(s)}))})}
const blobUrl=d=>{try{const m=/^data:([^;,]+);base64,(.*)$/.exec(d);if(!m)return d;const b=atob(m[2]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:m[1]}))}catch(e){return d}};
const lsSet=(id,a)=>{try{localStorage.setItem('cbt_a_'+id,JSON.stringify(a))}catch(e){}},lsGet=id=>{try{return JSON.parse(localStorage.getItem('cbt_a_'+id)||'null')}catch(e){return null}},lsDel=id=>{try{localStorage.removeItem('cbt_a_'+id)}catch(e){}};
const api=async b=>{const max=RETRY[b.action]?8:1;let r;for(let i=0;i<max;i++){try{const x=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});r=await x.json()}catch(e){r={ok:false,err:'Koneksi gagal. Periksa internet atau URL API. ('+(e.message||e)+')'}}
if(r.ok||i===max-1||!/sibuk|Koneksi gagal|Kesalahan server|Failed to fetch|NetworkError|timeout/i.test(r.err||''))return r;
{const m='Server sedang ramai, mencoba lagi ('+(i+2)+'/'+max+')…',l=$('#ld'),le=$('#le');if(l&&!l.hidden)l.textContent=m;else if(le&&b.action==='plogin')le.textContent=m}
await wait(800+Math.random()*Math.min(20000,1500*Math.pow(2,i)))}return r};
const busy=on=>{const e=$('#ld');e.hidden=!on;if(!on)e.textContent='Memproses…'};
const status=t=>{STAT=t;const e=$('#ss');if(e)e.textContent=t};
const td=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
const TB=['mapel','guru','topik','soal','grp','pes','tes','hasil'];
function snap(){SNAP={};TB.forEach(t=>{SNAP[t]={};(S[t]||[]).forEach(r=>{SNAP[t][r.id]=JSON.stringify(r)})});SNAP.cfg=JSON.stringify(S.cfg);SNAP.token=JSON.stringify(S.token)}
let sq=Promise.resolve();
function save(){if(!AU)return Promise.resolve();const ch={};
TB.forEach(t=>{const up=[],ids={};S[t].forEach(r=>{ids[r.id]=1;if(SNAP[t][r.id]!==JSON.stringify(r))up.push(r)});const rm=Object.keys(SNAP[t]).filter(i=>!ids[i]);if(up.length||rm.length)ch[t]={up,rm}});
if(SNAP.cfg!==JSON.stringify(S.cfg))ch.cfg=S.cfg;{const ot=JSON.parse(SNAP.token||'{}'),tk={};Object.keys(S.token||{}).forEach(k=>{if(JSON.stringify(ot[k])!==JSON.stringify(S.token[k]))tk[k]=S.token[k]});if(Object.keys(tk).length)ch.token=tk}
if(!Object.keys(ch).length)return Promise.resolve();
const na=ch.cfg&&S.role!=='guru'?{u:S.cfg.au,p:S.cfg.ap||AU.p}:null;snap();status('Menyimpan…');
return sq=sq.then(()=>api({action:'sync',auth:AU,ch})).then(r=>{if(r.ok){if(na)AU=na;status('Tersimpan ✓')}else{status('Gagal menyimpan');alert('Gagal menyimpan ke Google Sheets: '+r.err+'\nGunakan “Muat ulang data” lalu ulangi perubahan.')}})}
/* q=true: refresh ringan (hanya hasil ujian, di-cache server 20 detik). q kosong: muat semua data. */
async function loadAdmin(q){
 if(q){await sq;const r=await api({action:'ahasil',u:AU.u,p:AU.p});if(r.ok){S.hasil=r.hasil;SNAP.hasil={};S.hasil.forEach(x=>{SNAP.hasil[x.id]=JSON.stringify(x)});status('Diperbarui '+new Date().toLocaleTimeString('id-ID'));render()}return}
 busy(true);await sq;const r=await api({action:'alogin',u:AU.u,p:AU.p});busy(false);if(!r.ok){alert(r.err);return}S=r.S;snap();status('Data dimuat');render()}
let mode='login',page='dash',adm=false,P=null,cur=null,sel={},tmr=null,pt=null;
const gN=i=>(S.grp.find(x=>x.id===i)||{}).nama||'-',tN=i=>(S.topik.find(x=>x.id===i)||{}).nama||'-',mN=i=>(S.mapel.find(x=>x.id===i)||{}).nama||'-',myM=()=>S.role==='guru'?((S.guru[0]||{}).m||[]):S.mapel.map(x=>x.id),mOpts=()=>S.mapel.filter(x=>myM().includes(x.id)).map(x=>[x.id,x.nama]);
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class=mu>Belum ada data</td></tr>`}</table>`;
const sv=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([name.endsWith('.csv')?'\ufeff'+txt:txt],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
const closeM=()=>{$('#md').hidden=true};
/* Teks footer: ubah di sini */
const FOOT_NAMA='MTsN 3 Subang',FOOT_ALAMAT='Kabupaten Subang, Jawa Barat',FOOT_KET='Sistem Ujian Online Berbasis Komputer (CBT)';
const footH=()=>`<footer class="ft no"><b>${E(FOOT_KET)}</b><br>© ${new Date().getFullYear()} ${E(FOOT_NAMA)} · ${E(FOOT_ALAMAT)}<br>Seluruh hak dilindungi. Dilarang menyebarluaskan soal dan kunci jawaban.</footer>`;
const titi=()=>(S.cfg.tempat||'Subang')+', '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const IMG={},IMGP={};
const imgTag=(id,st)=>id?`<img data-img="${E(id)}" ${IMG[id]?`src="${IMG[id]}"`:''} alt="gambar" style="${st||'max-width:100%;max-height:320px;border-radius:8px;display:block;margin:8px 0'}">`:'';
let IMGQ=[],IMGN=0;
function imgPump(){while(IMGN<3&&IMGQ.length){const j=IMGQ.shift();IMGN++;j().finally(()=>{IMGN--;imgPump()})}}
const imgSet=(id,d)=>document.querySelectorAll('img[data-img="'+id+'"]').forEach(x=>x.src=d);
function getImg(id){if(IMG[id])return Promise.resolve(IMG[id]);
if(/^(https?:\/\/|\.{0,2}\/?img\/)/i.test(id)){IMG[id]=id;imgSet(id,id);return Promise.resolve(id)}
return IMGP[id]||(IMGP[id]=new Promise(res=>{IMGQ.push(()=>api({action:'img',id,auth:AU,tk:TK}).then(r=>{delete IMGP[id];if(r.ok){IMG[id]=blobUrl(r.d);imgSet(id,IMG[id])}res(IMG[id])}).catch(()=>{delete IMGP[id];res()}));imgPump()}))}
function hydrate(){document.querySelectorAll('img[data-img]').forEach(im=>{const id=im.dataset.img;if(!IMG[id])getImg(id)})}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej('File tidak terbaca');fr.onload=()=>{const im=new Image();im.onerror=()=>rej('File bukan gambar');im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.78,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>140000&&q>.2);d.length>280000?rej('Gambar terlalu besar/rumit'):res(d)};im.src=fr.result};fr.readAsDataURL(file)})}
async function pickImg(k,inp){const f=inp.files[0];if(!f)return;PBUSY++;const box=$('#ip_'+k);box.innerHTML='<span class=mu>Mengunggah…</span>';try{const d=await compress(f);const r=await api({action:'imgup',auth:AU,d});if(!r.ok)throw r.err;IMG[r.id]=d;PEND[k]=r.id;box.innerHTML=imgTag(r.id,'max-height:140px;max-width:100%;border-radius:6px')}catch(e){box.innerHTML='<span style="color:var(--er)">Gagal: '+E(e.message||e)+'</span>'}PBUSY--}
function clrImg(k){PEND[k]='';$('#ip_'+k).innerHTML=''}
async function cleanImg(){if(!confirm('Hapus gambar yang tidak dipakai soal mana pun?'))return;busy(true);const r=await api({action:'imgclean',auth:AU});busy(false);alert(r.ok?r.n+' gambar tidak terpakai dihapus.':r.err)}
function fld(f){const v=f.v??'',n=`name="${f.k}"`;let i;
if(f.t==='select')i=`<select ${n}>${f.o.map(([a,b])=>`<option value="${E(a)}" ${a==v?'selected':''}>${E(b)}</option>`).join('')}</select>`;
else if(f.t==='multi')return`<label>${f.l}</label>`+f.o.map(([a,b])=>`<label class=c><input type=checkbox ${n} value="${a}" ${(v||[]).includes(a)?'checked':''}>${E(b)}</label>`).join('');
else if(f.t==='check')return`<label class=c><input type=checkbox ${n} ${v?'checked':''}>${f.l}</label>`;
else if(f.t==='img')return`<label>${f.l}</label><div id="ip_${f.k}">${imgTag(PEND[f.k],'max-height:140px;max-width:100%;border-radius:6px')}</div><div class=row><input type=file accept="image/*" onchange="pickImg('${f.k}',this)" style="width:auto"><button type=button class="d x" onclick="clrImg('${f.k}')">Hapus gambar</button></div>`;
else if(f.t==='area')i=`<textarea ${n}>${E(v)}</textarea>`;else i=`<input ${n} type="${f.t||'text'}" value="${E(v)}">`;
return`<label>${f.l}</label>${i}`}
function form(title,fs,ok){const m=$('#md');m.innerHTML=`<div class=mb><h3>${title}</h3>${fs.map(fld).join('')}<div class=row><button id=okb>Simpan</button><button class=s onclick=closeM()>Batal</button></div></div>`;m.hidden=false;hydrate();
$('#okb').onclick=()=>{const o={};fs.forEach(f=>{const els=[...m.querySelectorAll(`[name="${f.k}"]`)];o[f.k]=f.t==='img'?(PEND[f.k]||''):f.t==='multi'?els.filter(e=>e.checked).map(e=>e.value):f.t==='check'?els[0].checked:els[0].value});if(ok(o)!==false){save();closeM();render()}}}
const del=(arr,i,msg)=>{if(confirm(msg||'Hapus data ini?')){const k=S[arr].findIndex(x=>x.id===i);S[arr].splice(k,1);save();render()}};
function go(p){if(p==='reload'){loadAdmin();return}page=p;render()}

/* ---------- LOGIN ---------- */
function loginView(){return`<div style="max-width:380px;margin:8vh auto;padding:12px"><div class=card><div style="text-align:center">${logoH(110)}<h1>${E(PUB.nama)}</h1><p class=mu>${E(PUB.ket)}</p></div>
<label>Username</label><input id=lu><label>Password</label><input id=lp type=password onkeydown="if(event.key==='Enter')doLogin('p')">
<div class=row><button onclick="doLogin('p')">Masuk sebagai Peserta</button></div><div class=row><button class=s onclick="doLogin('a')">Masuk Guru Mapel / Admin</button></div><div id=le class=mu></div>
${API_URL.startsWith('GANTI')?'<p style="color:var(--er)">⚠ URL API belum diisi di file ini.</p>':''}</div>${footH()}</div>`}
async function doLogin(t){const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p){$('#le').textContent='Isi username dan password.';return}
$('#le').textContent='Memeriksa…';
if(t==='a'){const r=await api({action:'alogin',u,p});if(!r.ok){$('#le').textContent=r.err;return}loadLibs();S=r.S;AU={u,p};snap();status('');adm=true;mode='admin';page='dash';render();if(S.warn)alert(S.warn)}
else{await wait(Math.random()*LOGIN_JITTER);const r=await api({action:'plogin',u,p});if(!r.ok){$('#le').textContent=r.err;return}TK=r.tk;OFF=(r.now||Date.now())-Date.now();P={...r.pes,pw:p};S={cfg:r.cfg,mapel:r.mapel||[],guru:[],topik:[],soal:[],grp:r.grp,pes:[],tes:r.tes,token:{},hasil:r.hasil};AU=null;mode='peserta';cur=null;render()}}
const logout=()=>{adm=false;P=null;cur=null;AU=null;TK='';clearInterval(tmr);clearTimeout(pt);S=seed();S.cfg={...PUB};mode='login';render()};

/* ---------- ADMIN / GURU ---------- */
const GURU_NAV=['akun','dash','topik','soal','imp','tes','token','hasil','rekap','rkm','analisis','remedial','reload'];
const NAV=[['dash','Dashboard'],['mapel','Mapel'],['guru','Guru Mapel'],['impg','Import Guru'],['topik','Topik'],['soal','Soal'],['imp','Import Soal'],['grp','Group'],['pes','Peserta'],['impp','Import Peserta'],['kartu','Cetak Kartu'],['tes','Daftar Tes'],['token','Token'],['hasil','Hasil Tes'],['rekap','Rekap Nilai'],['rkm','Rekap Kelas & Mapel'],['analisis','Analisis Butir Soal'],['remedial','Program Remedial & Pengayaan'],['set','Pengaturan & Backup'],['akun','Akun Saya'],['reload','⟳ Muat ulang data']];
function adminView(){const g=S.role==='guru';return`<div class=app><div class=side><h2>${E(S.cfg.nama)}</h2><small>${g?'Guru: '+E((S.guru[0]||{}).nama||''):'Panel Administrator'}<br><span id=ss>${E(STAT)}</span></small>${NAV.filter(([k])=>g?GURU_NAV.includes(k):k!=='akun').map(([k,l])=>`<a class="${page===k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}<a onclick="logout()">⎋ Keluar</a></div><div class=main>${PG[page]()}${footH()}</div></div>`}
const topSel=k=>`<select onchange="sel.${k}=this.value;render()">${S.topik.map(t=>`<option value="${t.id}" ${sel[k]===t.id?'selected':''}>${E(mN(t.m))} · ${E(t.nama)}</option>`).join('')}</select>`;
const tsel=()=>{if(!sel.t||!S.topik.find(x=>x.id===sel.t))sel.t=(S.topik[0]||{}).id;return sel.t};

function parseRows(txt){txt=String(txt||'').replace(/^\ufeff/,'');const first=(txt.split(/\r?\n/).find(l=>l.trim())||'').replace(/"[^"]*"/g,'');
let d=',',best=0;[['\t','\t'],['|','|'],[';',';'],[',',',']].forEach(([k,v])=>{const n=first.split(k).length-1;if(n>best){best=n;d=v}});
const rows=[];let row=[],f='',q=false;
for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
else if(c==='"'&&f==='')q=true;else if(c===d){row.push(f);f=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows.map(r=>r.map(x=>x.trim()))}

cur={h:r.h.id,i:0};clearInterval(tmr);tmr=setInterval(tick,1000);render()}
function tick(){const h=S.hasil.find(x=>x.id===cur?.h);if(!h||h.fin){clearInterval(tmr);return}const t=S.tes.find(x=>x.id===h.tes),r=endT(h,t)-(Date.now()+OFF);if(r<=0){clearInterval(tmr);if(h.tout)return;h.tout=1;busy(true);$('#ld').textContent='Waktu habis. Mengirim jawaban…';setTimeout(()=>finP(h,true),Math.random()*AUTO_JITTER);return}const e=$('#tm');if(e)e.textContent=Math.floor(r/60000)+':'+String(Math.floor(r/1000)%60).padStart(2,'0')}
function pushAns(){clearTimeout(pt);PT_AT=0;const h=S.hasil.find(x=>x.id===cur?.h);if(!h||h.fin)return Promise.resolve();const sig=JSON.stringify(h.a);if(h._ls===sig)return Promise.resolve();const set=t=>{const e=$('#sv');if(e)e.textContent=t};set('Menyimpan…');
return api({action:'pans',tk:TK,h:h.id,a:h.a}).then(r=>{if(r.ok)h._ls=sig;else{clearTimeout(pt);pt=setTimeout(pushAns,15000+Math.random()*15000)}set(r.ok?'Tersimpan ✓':'Gagal simpan, mencoba lagi…')})}
async function finP(h,auto){clearInterval(tmr);clearTimeout(pt);busy(true);let r=await api({action:'pfin',tk:TK,h:h.id,a:h.a});if(!r.ok)r=await api({action:'pfin',tk:TK,h:h.id,a:h.a});busy(false);
if(!r.ok){alert('Gagal mengirim jawaban: '+r.err+'\nPeriksa koneksi lalu tekan Selesai lagi.');h.tout=0;cur&&(tmr=setInterval(tick,1000));return}
lsDel(h.id);Object.assign(h,r.h);h.fin=true;exitFS();hideWarn();if(auto)alert('Waktu habis. Jawaban Anda sudah dikirim.');render()}
function examView(){const h=S.hasil.find(x=>x.id===cur.h),t=S.tes.find(x=>x.id===h.tes);if(h.fin){clearInterval(tmr);return`<div class=card><h1>Tes selesai ✔</h1><p>Jawaban Anda sudah tersimpan.</p>${t.th?`<div class=st><b>${h.nilai}</b>Nilai Anda</div>`:''}<div class=row><button onclick="cur=null;render()">Kembali</button></div></div>`}
const sid=h.ids[cur.i],s=S.soal.find(x=>x.id===sid),pm=h.perm[sid];
return`<div class="row" style="justify-content:space-between"><b>${E(t.nama)}</b><span><span id=sv class=mu></span> <span class=tag>⏱ <span id=tm>--:--</span></span></span></div>
<div class=card><div class=mu>Soal ${cur.i+1} dari ${h.ids.length}</div><p style="font-size:16px;white-space:pre-wrap">${E(s.q)}</p>${imgTag(s.img)}${pm.map((o,n)=>`<div class="opt ${h.a[sid]===o?'on':''}" onclick="ans('${sid}',${o})"><b>${'ABCDE'[n]}.</b><span>${E(s.o[o]||'')}${imgTag((s.oi||[])[o],'max-width:100%;max-height:200px;display:block;margin-top:4px;border-radius:6px')}</span></div>`).join('')}
<div class=row><button class=s onclick="nav(-1)" ${cur.i?'':'disabled'}>← Sebelumnya</button><button class=s onclick="nav(1)" ${cur.i<h.ids.length-1?'':'disabled'}>Berikutnya →</button><button onclick="fin()" style="margin-left:auto">Selesai</button></div></div>
<div class=card><div class=num>${h.ids.map((i,n)=>`<button class="${n===cur.i?'cur':h.a[i]!==undefined?'a':''}" onclick="cur.i=${n};rx()">${n+1}</button>`).join('')}</div></div>`}
/* pindah soal: hanya area soal yang digambar ulang (tanpa membangun ulang seluruh halaman) */
function rx(){const e=$('#ex');if(!e||!cur)return render();e.innerHTML=examView();hydrate();tick();window.scrollTo(0,0)}
function ans(s,o){const h=S.hasil.find(x=>x.id===cur.h);if(!h||h.tout||h.fin)return;h.a[s]=o;lsSet(h.id,h.a);{const pm=h.perm[s]||[];document.querySelectorAll('#root .opt').forEach((el,n)=>el.classList.toggle('on',pm[n]===o));const nb=document.querySelectorAll('#root .num button')[cur.i];if(nb&&!nb.classList.contains('cur'))nb.classList.add('a')}const e=$('#sv');if(e)e.textContent='Tersimpan di perangkat ✓';if(!PT_AT||Date.now()-PT_AT>SYNC_MIN+SYNC_RND+5000){PT_AT=Date.now();clearTimeout(pt);pt=setTimeout(pushAns,SYNC_MIN+Math.random()*SYNC_RND)}}
const nav=d=>{cur.i+=d;rx()};
function fin(){const h=S.hasil.find(x=>x.id===cur.h),k=h.ids.filter(i=>h.a[i]===undefined).length;VIO.mute=Date.now()+60000;const okc=confirm(k?`Masih ${k} soal belum dijawab. Akhiri tes?`:'Akhiri tes dan kirim jawaban?');VIO.mute=Date.now()+1500;if(okc)finP(h)}

/* ---------- PENGAMAN ANTI-MENYONTEK ---------- */
const VIO={last:0,mute:0,fs:false};
const exitFS=()=>{VIO.fs=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
const curH=()=>cur&&S.hasil.find(x=>x.id===cur.h);
function antiOn(){if(mode!=='peserta'||!cur)return false;const h=curH();if(!h||h.fin)return false;const t=S.tes.find(x=>x.id===h.tes);return !!t&&t.anti!==false}
let WM_K='',WM_H='';
function wmH(){if(!antiOn())return'';const k=P.nama+'|'+P.u;if(k!==WM_K){WM_K=k;const tx=E((P.nama||'')+' · '+(P.u||'')),svg="<svg xmlns='http://www.w3.org/2000/svg' width='300' height='170'><text x='150' y='90' text-anchor='middle' transform='rotate(-25 150 85)' font-family='Arial' font-size='15' font-weight='bold' fill='#777'>"+tx+"</text></svg>";WM_H=`<div class=wm style="background-image:url(&quot;data:image/svg+xml,${encodeURIComponent(svg)}&quot;)"></div>`}return WM_H}
function hideWarn(){const w=$('#wr');if(w)w.hidden=true}
function showWarn(j,n,mx){const w=$('#wr');if(!w)return;w.innerHTML=`<div class=b><div style="font-size:42px">⚠️</div><h3>Pelanggaran ${n}${mx?' dari '+mx:''}</h3><p>${E(j)}.</p><p class=mu>${mx?'Jika melebihi batas, ujian otomatis dikumpulkan.':'Tindakan ini dicatat dan dilihat pengawas.'}</p><div class=row style="justify-content:center"><button onclick="hideWarn();try{if(VIO.fs&&!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}">Kembali ke ujian</button></div></div>`;w.hidden=false}
function viol(j){if(!antiOn())return;const now=Date.now();if(now<VIO.mute||now-VIO.last<1500)return;VIO.last=now;const h=curH(),t=S.tes.find(x=>x.id===h.tes),mx=t.maxv===undefined?3:(+t.maxv||0);h.v=(h.v||0)+1;
api({action:'pviol',tk:TK,h:h.id,j,a:h.a}).then(r=>{if(!r.ok)return;h.v=r.v;if(r.fin){Object.assign(h,r.h);h.fin=true;clearInterval(tmr);clearTimeout(pt);exitFS();hideWarn();render();alert('Ujian dikumpulkan otomatis karena pelanggaran melebihi batas ('+mx+'×).')}});showWarn(j,h.v,mx)}
function initAnti(){document.addEventListener('visibilitychange',()=>{if(document.hidden)viol('Berpindah tab atau aplikasi')});
/* blur ditunda 1,5 detik: notifikasi/keyboard/sentuhan sesaat tidak dihitung sebagai pelanggaran */
let bt;window.addEventListener('blur',()=>{clearTimeout(bt);bt=setTimeout(()=>{if(!document.hasFocus()&&!document.hidden)viol('Jendela ujian tidak aktif')},1500)});
window.addEventListener('focus',()=>clearTimeout(bt));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&VIO.fs)viol('Keluar dari layar penuh')});
['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(e=>document.addEventListener(e,ev=>{if(antiOn())ev.preventDefault()}));
document.addEventListener('keydown',ev=>{if(!antiOn())return;const k=String(ev.key).toLowerCase(),c=ev.ctrlKey||ev.metaKey;
if(ev.key==='F12'||(c&&ev.shiftKey&&'ijc'.includes(k))||(c&&k==='u')){ev.preventDefault();viol('Mencoba membuka alat pengembang')}
else if(c&&k==='p'){ev.preventDefault();viol('Mencoba mencetak halaman ujian')}
else if(c&&'cvxas'.includes(k))ev.preventDefault()});
document.addEventListener('keyup',ev=>{if(antiOn()&&ev.key==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(e){}viol('Mengambil tangkapan layar')}});
window.addEventListener('beforeunload',ev=>{if(antiOn()){ev.preventDefault();ev.returnValue=''}});
window.addEventListener('popstate',()=>{if(antiOn()){try{history.pushState(null,'',location.href)}catch(e){}}})}
function render(){$('#root').innerHTML=mode==='login'?loginView():mode==='admin'?adminView():pesView();if(mode==='peserta'&&cur)tick();hydrate();if(document.body.classList)document.body.classList.toggle('anti',!!antiOn())}
initAnti();render();
/* refresh otomatis admin/guru tiap 5 menit, ringan (hanya data hasil, tidak saat mengetik/menyaring) */
setInterval(()=>{const a=document.activeElement;if(mode==='admin'&&AU&&!document.hidden&&$('#md').hidden&&['dash','hasil','rekap'].includes(page)&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))loadAdmin(true)},300000);
setTimeout(()=>{api({action:'info'}).then(r=>{if(r.ok){PUB=r.cfg;if(mode==='login'&&!(($('#lu')||{}).value)){S.cfg={...PUB};render()}}})},Math.random()*3000);
</script></body></html>
